<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Emotional Archive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #f0f6fc;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px;
            color: #f0f6fc;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* Error shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #f85149 !important;
        }

        .error-msg {
            color: #f85149;
            font-size: 0.8rem;
            height: 20px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.visible {
            opacity: 1;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .counter {
            font-size: 0.85rem;
            color: #8b949e;
        }

        button {
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #2ea043;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Floating capsule animation container */
        #stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .capsule {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(88, 166, 255, 0.15);
            border: 1px solid rgba(88, 166, 255, 0.4);
            backdrop-filter: blur(6px);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #c9d1d9;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: floatUp 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                bottom: 20px;
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            70% {
                opacity: 0.8;
            }
            100% {
                bottom: 75vh;
                opacity: 0;
                transform: translateX(-50%) scale(0.8) translateY(-20px);
            }
        }

        /* Success feedback banner */
        .feedback-banner {
            margin-top: 20px;
            padding: 12px;
            background: rgba(35, 134, 54, 0.15);
            border: 1px solid rgba(35, 134, 54, 0.4);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #3fb950;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div id="stage"></div>

    <div class="container">
        <h1>The Emotional Archive</h1>
        <p class="subtitle">Type what weighs on your mind. Seal it away, and let it dissolve into the archive.</p >
        
        <textarea id="thoughtInput" placeholder="Write down your worries here..."></textarea>
        <div id="errorMsg" class="error-msg">Nothing is written here yet. Type something to archive.</div>
        
        <div class="actions">
            <span class="counter"><span id="count">128</span> items archived today</span>
            <button id="sealBtn">Seal & Release</button>
        </div>

        <div id="feedbackBanner" class="feedback-banner">
            ✨ Archived successfully. Your mind is a bit lighter now.
        </div>
    </div>

    <script>
        const input = document.getElementById('thoughtInput');
        const btn = document.getElementById('sealBtn');
        const errorMsg = document.getElementById('errorMsg');
        const stage = document.getElementById('stage');
        const countSpan = document.getElementById('count');
        const feedbackBanner = document.getElementById('feedbackBanner');
        
        let archivedCount = 128;

        const responses = [
            "✨ Archived successfully. Take a deep breath.",
            "🌊 Released. What's done is done; make space for tomorrow.",
            "🍃 Stored securely. You don't have to carry it all at once.",
            "💫 Captured. Rest well tonight."
        ];

        btn.addEventListener('click', () => {
            const text = input.value.trim();

            if (text === "") {
                input.classList.add('shake');
                errorMsg.classList.add('visible');
                
                setTimeout(() => {
                    input.classList.remove('shake');
                }, 400);
                return;
            }

            errorMsg.classList.remove('visible');
            createCapsule(text);

            archivedCount++;
            countSpan.textContent = archivedCount;
            input.value = "";

            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            feedbackBanner.textContent = randomResponse;
            feedbackBanner.style.display = 'block';

            setTimeout(() => {
                feedbackBanner.style.display = 'none';
            }, 4000);
        });

        input.addEventListener('input', () => {
            if (input.value.trim() !== "") {
                errorMsg.classList.remove('visible');
            }
        });

        function createCapsule(text) {
            const capsule = document.createElement('div');
            capsule.className = 'capsule';
            capsule.textContent = text;
            stage.appendChild(capsule);

            setTimeout(() => {
                capsule.remove();
            }, 3500);
        }
    </script>
</body>
</html>
